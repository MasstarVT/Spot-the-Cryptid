<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Cryptid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Everything on screen lives inside #game. game.js sizes it to the
       biggest whole-number multiple of 320x180 that fits the window
       (exactly 6x in a 1920x1080 OBS browser source). The text in these
       boxes is filled in by game.js, so each message has one home. -->
  <div id="game">
    <!-- The pixel-art forest. Its real size is only 320x180. -->
    <canvas id="scene"></canvas>

    <!-- Grid lines (drawn by style.css) and A-P / 1-9 labels (added by grid.js) -->
    <div id="grid" aria-hidden="true"></div>

    <!-- Top left: round timer and round info (goal, guesses, hint) -->
    <div id="roundBox" class="hud-box">
      <div id="timer"></div>
      <div id="hint"></div>
    </div>

    <!-- Top right: leaderboard -->
    <div id="leaderboard" class="hud-box">
      <div class="hud-title">Top spotters</div>
      <ol id="scoreList"></ol>
    </div>

    <!-- Top middle: winner banner, short notices and the debug box -->
    <div id="centerTop">
      <div id="banner" class="panel" hidden>
        <p id="bannerTitle"></p>
        <p id="bannerDetail"></p>
      </div>
      <div id="notice" class="hud-box" hidden></div>
      <form id="debugForm" class="hud-box" hidden autocomplete="off">
        <input id="debugInput" type="text" value="Tester: !spot C4" spellcheck="false" aria-label="Pretend chat message">
        <button type="submit">Send</button>
        <span id="debugInfo"></span>
      </form>
    </div>

    <!-- Bottom left: recent guesses. Bottom right: connection status. -->
    <ol id="feed" class="hud-box"></ol>
    <div id="status" class="hud-box">
      <div id="connection"></div>
      <div id="keyHelp">N new round &middot; R reveal &middot; X X reset scores<br>G grid &middot; C change channel &middot; Shift+click test guess</div>
    </div>

    <!-- Middle: shown when the address has no ?channel= (or after key C) -->
    <form id="channelForm" class="panel" hidden autocomplete="off">
      <label for="channelInput">Twitch channel</label>
      <input id="channelInput" type="text" maxlength="80" spellcheck="false" placeholder="yourchannel"><button type="submit">Connect</button>
      <p id="channelError"></p>
      <p class="form-small">Read-only: the game never posts in your chat.</p>
    </form>
  </div>

  <!-- Plain (classic) scripts, not modules: Chrome blocks modules on
       file:// pages. ORDER MATTERS: each file uses names from the files
       above it, and game.js starts the game, so it goes last. -->
  <script src="sprites.js"></script>  <!-- PALETTE, SPRITES, CRYPTIDS -->
  <script src="scene.js"></script>    <!-- Scene -->
  <script src="grid.js"></script>     <!-- Grid -->
  <script src="twitch.js"></script>   <!-- Twitch -->
  <script src="game.js"></script>     <!-- Game: starts everything -->
</body>
</html>
